<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Little Album</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💗</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="hearts" aria-hidden="true"></div>

  <header class="hero">
    <p class="kicker">our little album</p>
    <h1><span id="name1"></span> <span class="amp">&amp;</span> <span id="name2"></span></h1>
    <p class="tagline" id="tagline"></p>
    <div class="counter">
      <span class="count" id="days">0</span>
      <span class="label">days together</span>
    </div>
  </header>

  <main>
    <section class="gallery" id="gallery"></section>
  </main>

  <footer id="footer"></footer>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lb-btn lb-close" aria-label="Close">×</button>
    <button class="lb-btn lb-prev" aria-label="Previous">‹</button>
    <figure class="lb-figure">
      <img id="lb-img" alt="" />
      <figcaption id="lb-cap"></figcaption>
    </figure>
    <button class="lb-btn lb-next" aria-label="Next">›</button>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
